<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 620" width="780" height="620">
  <defs>
    <radialGradient id="gemShine" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#8fd6b0"/>
      <stop offset="60%" stop-color="#1B5E3F"/>
      <stop offset="100%" stop-color="#123e29"/>
    </radialGradient>
  </defs>

  <!-- ============ WIREFRAME GLOBE ============ -->
  <g fill="none" stroke="#D4A24E" stroke-width="2.5">
    <!-- outer circle -->
    <circle cx="390" cy="220" r="165" stroke-width="4"/>

    <!-- latitude lines -->
    <ellipse cx="390" cy="165" rx="155.6" ry="13"/>
    <ellipse cx="390" cy="120" rx="131.2" ry="12"/>
    <ellipse cx="390" cy="75"  rx="78.7"  ry="10"/>
    <ellipse cx="390" cy="275" rx="155.6" ry="13"/>
    <ellipse cx="390" cy="320" rx="131.2" ry="12"/>
    <ellipse cx="390" cy="365" rx="78.7"  ry="10"/>

    <!-- meridian lines -->
    <ellipse cx="390" cy="220" rx="149.5" ry="165"/>
    <ellipse cx="390" cy="220" rx="106"   ry="165"/>
    <ellipse cx="390" cy="220" rx="42.7"  ry="165"/>

    <!-- equatorial axis line with end ticks -->
    <line x1="180" y1="220" x2="600" y2="220" stroke-width="3"/>
    <line x1="180" y1="212" x2="180" y2="228" stroke-width="3"/>
    <line x1="600" y1="212" x2="600" y2="228" stroke-width="3"/>
  </g>

  <!-- ============ D2G WORDMARK ============ -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="900" paint-order="stroke fill" stroke="#1A2332" stroke-width="4" stroke-linejoin="round">
    <text x="228" y="300" font-size="152" fill="#FFFFFF">D</text>
    <text x="300" y="335" font-size="225" fill="#D4A24E" font-family="Georgia, 'Times New Roman', serif">2</text>
    <text x="418" y="300" font-size="152" fill="#FFFFFF">G</text>
  </g>

  <!-- ============ GEM ACCENT ============ -->
  <circle cx="390" cy="394" r="26" fill="url(#gemShine)" stroke="#D4A24E" stroke-width="3.5"/>
  <ellipse cx="381" cy="385" rx="8" ry="4.5" fill="#ffffff" opacity="0.55"/>

  <!-- ============ SWOOSH ============ -->
  <path d="M 85 448 C 175 502, 300 488, 390 412" fill="none" stroke="#D4A24E" stroke-width="15" stroke-linecap="round"/>
  <path d="M 390 412 C 462 355, 585 345, 685 322" fill="none" stroke="#D4A24E" stroke-width="7" stroke-linecap="round"/>

  <!-- ============ TAGLINE ============ -->
  <line x1="182" y1="556" x2="272" y2="556" stroke="#D4A24E" stroke-width="2"/>
  <text x="390" y="563" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="5" fill="#F7F4EE" text-anchor="middle">DUBAI 2 GLOBAL</text>
  <line x1="508" y1="556" x2="598" y2="556" stroke="#D4A24E" stroke-width="2"/>
</svg>
