:root{--green:#1B5E3F;--navy:#1A2332;--gold:#D4A24E;--off:#F7F4EE;--sage:#DDE5DD;--slate:#5C6672}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1920px;background:var(--off);font-family:Poppins,sans-serif;color:var(--navy);position:relative;overflow:hidden}
.head{position:absolute;left:0;right:0;top:0;height:545px;background:#fff;border-bottom:8px solid var(--gold);text-align:center}
.logo{height:340px;margin-top:160px}
.kicker{position:absolute;top:590px;left:0;right:0;text-align:center;color:var(--gold);font-weight:600;font-size:26px;letter-spacing:8px;text-transform:uppercase}
h1{position:absolute;top:635px;left:70px;right:70px;text-align:center;font-size:76px;line-height:1.08;font-weight:700}

.ph img{width:100%;height:100%;object-fit:cover;object-position:center 75%}

.ph b i{font-style:normal;color:var(--gold)}
.pills{position:absolute;top:1535px;left:70px;right:70px;display:flex;gap:14px}
.pills div{flex:1;text-align:center;border:2px solid var(--sage);border-radius:50px;padding:13px 0;font-size:23px;font-weight:600;color:var(--green);background:#fff}
.cta{position:absolute;top:1630px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--navy);font-weight:700;font-size:36px;padding:24px 60px;border-radius:60px;white-space:nowrap}
.url{position:absolute;top:1760px;left:0;right:0;text-align:center;font-size:32px;font-weight:600;color:var(--green)}
