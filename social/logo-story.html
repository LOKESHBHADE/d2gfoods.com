<!doctype html>
<html><head><meta charset="utf-8"><title>D2G Logo Story</title>
<style>
@font-face{font-family:Poppins;font-weight:400;src:url(fonts/poppins-400.woff2) format('woff2')}
@font-face{font-family:Poppins;font-weight:500;src:url(fonts/poppins-500.woff2) format('woff2')}
@font-face{font-family:Poppins;font-weight:600;src:url(fonts/poppins-600.woff2) format('woff2')}
@font-face{font-family:Poppins;font-weight:700;src:url(fonts/poppins-700.woff2) format('woff2')}
:root{--green:#1B5E3F;--navy:#1A2332;--gold:#D4A24E;--off:#F7F4EE;--sage:#DDE5DD;--slate:#5C6672}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1920px;background:var(--off);font-family:Poppins,sans-serif;color:var(--navy);position:relative;overflow:hidden}
.band{position:absolute;left:0;right:0;top:0;height:100%;}
.ring{position:absolute;left:50%;top:230px;width:1300px;height:1300px;margin-left:-650px;border-radius:50%;border:2px solid var(--sage)}
.ring.r2{width:960px;height:960px;margin-left:-480px;top:400px}
.logo{position:absolute;left:50%;top:230px;width:760px;margin-left:-380px}
h1{position:absolute;top:1040px;left:70px;right:70px;text-align:center;font-size:72px;line-height:1.1;font-weight:700}
h1 span{color:var(--green)}
.sub{position:absolute;top:1255px;left:110px;right:110px;text-align:center;font-size:30px;line-height:1.45;color:var(--slate)}
.pills{position:absolute;top:1390px;left:70px;right:70px;display:flex;flex-wrap:wrap;gap:16px;justify-content:center}
.pills div{border:2px solid var(--sage);border-radius:50px;padding:14px 34px;font-size:26px;font-weight:600;color:var(--green);background:#fff}
.cta{position:absolute;top:1560px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--navy);font-weight:700;font-size:36px;padding:26px 60px;border-radius:60px;white-space:nowrap}
.url{position:absolute;top:1700px;left:0;right:0;text-align:center;font-size:34px;font-weight:600;color:var(--green)}
.top{position:absolute;left:0;right:0;top:0;height:18px;background:var(--green);border-bottom:8px solid var(--gold)}
</style></head><body>
<div class="top"></div><div class="ring"></div><div class="ring r2"></div>
<img class="logo" src="images/d2g-logo-new.png">
<h1>Your Trusted <span>Food Trading</span> Partner</h1>
<p class="sub">Licensed in Dubai. Supplying importers, hotels, supermarkets &amp; distributors across the UAE and beyond.</p>
<div class="pills"><div>Spices</div><div>Dry Fruits</div><div>Fresh Produce</div><div>Grains &amp; Pulses</div></div>
<div class="cta">Get a Quote →</div>
<div class="url">d2gfoods.com</div>
</body></html>
