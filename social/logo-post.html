<!doctype html>
<html><head><meta charset="utf-8"><title>D2G Logo Post</title>
<style>
@font-face{font-family:Poppins;font-weight:400;src:url(fonts/poppins-400.woff2) format('woff2')}
@font-face{font-family:Poppins;font-weight:500;src:url(fonts/poppins-500.woff2) format('woff2')}
@font-face{font-family:Poppins;font-weight:600;src:url(fonts/poppins-600.woff2) format('woff2')}
@font-face{font-family:Poppins;font-weight:700;src:url(fonts/poppins-700.woff2) format('woff2')}
:root{--green:#1B5E3F;--navy:#1A2332;--gold:#D4A24E;--off:#F7F4EE;--sage:#DDE5DD;--slate:#5C6672}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1350px;background:var(--off);font-family:Poppins,sans-serif;color:var(--navy);position:relative;overflow:hidden}
.top{height:14px;background:var(--green)} .top:after{content:"";display:block;height:6px;background:var(--gold);margin-top:14px}
.ring{position:absolute;left:50%;top:420px;width:1200px;height:1200px;margin-left:-600px;border-radius:50%;border:2px solid var(--sage)}
.ring.r2{width:900px;height:900px;margin-left:-450px;top:570px}
.logo{position:absolute;left:50%;top:70px;width:760px;margin-left:-380px}
.kick{position:absolute;top:850px;left:0;right:0;text-align:center;color:var(--gold);font-weight:600;font-size:26px;letter-spacing:8px;text-transform:uppercase}
h1{position:absolute;top:900px;left:70px;right:70px;text-align:center;font-size:62px;line-height:1.12;font-weight:700}
h1 span{color:var(--green)}
.pills{position:absolute;top:1085px;left:70px;right:70px;display:flex;gap:14px}
.pills div{flex:1;text-align:center;border:2px solid var(--sage);border-radius:50px;padding:12px 0;font-size:21px;font-weight:600;color:var(--green);background:#fff}
.foot{position:absolute;left:0;right:0;bottom:0;height:150px;background:var(--navy);display:flex;align-items:center;justify-content:space-between;padding:0 70px;border-top:8px solid var(--gold)}
.foot .site{font-size:38px;font-weight:700;color:#fff}
.foot .ph{font-size:24px;color:var(--gold);font-weight:600}
</style></head><body>
<div class="top"></div><div class="ring"></div><div class="ring r2"></div>
<img class="logo" src="images/d2g-logo-new.png">
<h1>Premium Food, <span>Delivered Worldwide.</span></h1>
<div class="pills"><div>Spices</div><div>Dry Fruits</div><div>Fresh Produce</div><div>Grains &amp; Pulses</div></div>
<div class="foot"><div class="site">d2gfoods.com</div><div class="ph">+971 52 105 5930</div></div>
</body></html>
